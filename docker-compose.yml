services:
  postgres:
    image: postgres:16-alpine
    container_name: revomart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: revomart
      POSTGRES_PASSWORD: revomart_dev
      POSTGRES_DB: revomart
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revomart -d revomart"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: revomart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
